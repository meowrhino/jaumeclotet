  <!-- projecte.html?slug=X: a la web construïda redirigeix a /X/; a la vista prèvia pinta el projecte -->
  <script>
    (function () {
      var slug = new URLSearchParams(location.search).get("slug");
      // a la web construïda, cap a /X/; a la vista prèvia (Live Server) es pinta aquí mateix
      if (slug && document.documentElement.hasAttribute("data-built")) location.replace("./" + encodeURIComponent(slug) + "/");
    })();
  </script>
